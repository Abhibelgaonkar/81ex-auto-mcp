name: Run Cloud OCR Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-ocr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests Library
        run: pip install requests

      # Executes your script from the subfolder
      - name: Execute OCR Script
        run: python ocr_api.py
